services:
  packet-capture:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      ANALYSIS_RUNTIME_DIR: /tmp
      ANALYSIS_IDLE_SECONDS: 900
      MAX_UPLOAD_BYTES: 268435456
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
