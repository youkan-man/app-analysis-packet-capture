services:
  packet-capture:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - capture_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      CAPTURE_DIR: /data
      MAX_UPLOAD_BYTES: 268435456
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  capture_data:
