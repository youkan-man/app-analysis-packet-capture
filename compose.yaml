services:
  packet-capture:
    build: .
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    pids_limit: 256
    environment:
      UVICORN_HOST: ${LISTEN_ADDRESS:-127.0.0.1}
      UVICORN_PORT: ${PORT:-8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('UVICORN_PORT', '8080') + '/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
