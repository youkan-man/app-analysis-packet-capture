name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: pcana-ci
      PORT: 18080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Retain tested source
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/tested-source.zip
          git rev-parse HEAD > artifacts/tested-commit.txt
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TShark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx pyyaml
      - name: Check code and tests
        run: |
          python -m compileall -q app tests
          for file in static/app/*.js; do node --check "$file"; done
          pytest -q --junitxml=artifacts/pytest.xml
          node tests/live_worker_contract.js
          docker compose config -q
      - name: Build and start the standard single-service application
        run: |
          docker compose up --build -d
          container=$(docker compose ps -q packet-capture)
          echo "PCANA_CONTAINER=$container" >> "$GITHUB_ENV"
          test "$(docker compose ps -q | wc -l)" -eq 1
          test "$(docker exec "$container" id -u)" = 10001
          docker exec "$container" python -c "from pathlib import Path; s=Path('/proc/self/status').read_text(); assert int(s.split('CapEff:')[1].split()[0],16)==0"
          image=$(docker inspect --format '{{.Image}}' "$container")
          # Deliberately deny capture permission in one negative-test process.
          docker run --rm -d --name pcana-unavailable-ci --init --network host --read-only --cap-drop=ALL --tmpfs /tmp -e UVICORN_PORT=18082 "$image"
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18080/healthz
      - name: Install browser tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium integration and screenshots
        run: |
          python -m tests.sample_capture artifacts/test.pcap
          python -m tests.inspection_capture artifacts/inspection.pcap
          node tests/layout_probe.js
          node tests/browser_smoke.js
          node tests/browser_inspection.js
          python -m tests.formal_capture artifacts/lab-inspection.pcap
          node tests/browser_formal.js
          node tests/browser_local.js
          node tests/browser_loading.js
          python tests/live_traffic.py > artifacts/live-traffic.log 2>&1 &
          traffic_pid=$!
          trap 'kill "$traffic_pid" || true' EXIT
          node tests/browser_live.js
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color > artifacts/server.log 2>&1 || true
          docker compose down || true
          docker stop pcana-unavailable-ci || true
          sudo ip link del pcana-ci0 2>/dev/null || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packet-workbench-ui-evidence
          path: artifacts/
          if-no-files-found: error
