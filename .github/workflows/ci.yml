name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TShark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Check code and tests
        run: |
          python -m compileall -q app tests
          for file in static/app/*.js; do node --check "$file"; done
          pytest -q
      - name: Build Docker image
        run: docker build -t packet-capture-workbench:ci .
      - name: Container smoke test
        run: |
          docker run --rm -d --name packet-workbench-ci --read-only --cap-drop=ALL --security-opt no-new-privileges --tmpfs /tmp -v packet-workbench-ci-data:/data -p 127.0.0.1:18081:8080 packet-capture-workbench:ci
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18081/healthz
          docker logs packet-workbench-ci
          docker stop packet-workbench-ci
      - name: Install browser tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium integration and screenshots
        run: |
          mkdir -p artifacts
          python -m tests.sample_capture artifacts/test.pcap
          uvicorn app.main:app --host 127.0.0.1 --port 18080 > artifacts/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          node tests/browser_smoke.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packet-workbench-ui-evidence
          path: artifacts/
          if-no-files-found: ignore
