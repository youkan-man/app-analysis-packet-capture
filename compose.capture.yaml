# Optional Linux host capture. Merge with compose.yaml; the web app stays nonroot.
services:
  packet-capture:
    environment:
      CAPTURE_SOCKET: /run/capture/agent.sock
    volumes:
      - capture_socket:/run/capture:ro
    depends_on:
      - capture-agent
  capture-agent:
    build: .
    command: ["uvicorn", "app.capture_agent:app", "--uds", "/run/capture/agent.sock", "--no-access-log"]
    user: "0:0"
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=320m,mode=1777
    volumes:
      - capture_socket:/run/capture
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    environment:
      CAPTURE_INTERFACES: ${CAPTURE_INTERFACES:-}
      CAPTURE_IDLE_SECONDS: 120
      MAX_LIVE_CAPTURES: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/run/capture/agent.sock'); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  capture_socket:
